server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartrent}
    username: ${SPRING_DATASOURCE_USERNAME:smartrent}
    password: ${SPRING_DATASOURCE_PASSWORD:smartrent}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-64-byte-production-secret}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
