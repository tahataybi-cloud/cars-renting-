services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrent}
      POSTGRES_USER: ${POSTGRES_USER:-smartrent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartrent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartrent} -d ${POSTGRES_DB:-smartrent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/smartrent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartrent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartrent}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-64-byte-production-secret}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  analytics-service:
    build: ./analytics-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartrent}:${POSTGRES_PASSWORD:-smartrent}@postgres:5432/${POSTGRES_DB:-smartrent}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_ANALYTICS_URL: ${VITE_ANALYTICS_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
      - analytics-service

volumes:
  postgres-data:

